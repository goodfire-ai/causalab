[project]
name = "causalab"
version = "0.0.1"
description = "A toolkit for causal analysis of artificial neural networks."
authors = [
    { name = "Atticus Geiger" },
    { name = "Max Loeffler"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "networkx",
    "matplotlib",
    "pandas",
    "numpy",
    "scikit-learn",
    "seaborn",
    # Qwen3.6-35B-A3B needs models/qwen3_5_moe from transformers 5.16.
    "transformers>=5.16",
    "safetensors",
    # The loader uses accelerate's device_map to read weights onto the device.
    # Verify a newer accelerate release before raising the cap.
    "accelerate>=1.14.0,<1.15",
    "tensorboard",
    "rich",
    "umap-learn>=0.5.0",
    "pot>=0.9.0",
    "datasets>=2.20.0",
    # Parse YAML experiment documents.
    "pyyaml>=6.0",
    # paired_ttest@1 uses the t-distribution CDF.
    "scipy>=1.10",
    # Interactive HTML figures import plotly at module scope.
    "plotly>=5.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: tiny-config end-to-end runner smoke tests; <5 min total wall for the pull-request selection (the `measurement_study` and `parallel_world` tests, deselected there, are minutes each), no numerical assertions beyond artifact existence",
    "numerical_unit: pinned-value CPU tests on fixed seeds (losses, metrics, sample outputs)",
    "golden: value-pinned end-to-end runner goldens on the coherent model; the sole GPU tier (CI runs -m 'not golden' and skips it); also the checks that need a gated model's files, such as its tokenizer, and no accelerator",
    "property: invariances/equivariances and determinism",
    "unit: default tier for pure functions, parsers, and small utilities",
    # Tests with this marker skip when CUDA is unavailable.
    "cuda: needs a CUDA device",
    # Two COST markers, orthogonal to the tiers (a test still declares exactly
    # one tier): tests that take minutes each on the two-vCPU CI runner. The
    # pull-request gate deselects both (test.yml, `-m "not golden and not
    # measurement_study and not parallel_world"`); the nightly CPU job (`-m "not
    # golden"`) runs them. Nothing infers either: a new module of the same kind
    # must add the marker to its own `pytestmark`. Measured on the merged tree
    # 2026-09-22 (one serial CI run, 74 min): the studies 22.6 min, the
    # twelve parallel_world modules 27.6 min, everything else 11.3 min.
    #
    # `measurement_study`: the four end-to-end study modules under
    # tests/measurement/study/ (test_controller.py, test_distinct_commits.py,
    # test_workflow_comparison.py, test_workflow_training.py; the directory's
    # other modules are plain `unit` and stay on the PR gate) — each builds and
    # installs a source wheel (the Cargo workspace included) and spawns cold
    # worker processes.
    "measurement_study: end-to-end measurement studies that build source arms and spawn cold workers; minutes each, so the PR gate deselects them and the nightly CPU job runs them",
    # `parallel_world`: modules whose tests run a document or a fit across a
    # spawned multi-rank process world (tp/ep/pp/cp/dp on the tiny fixtures,
    # up to eight ranks each importing torch) and cost a minute or more
    # serially; the cost is the deciding half. Same-shape modules under the
    # threshold stay on the PR gate unmarked (test_sharded_load_cast.py beside
    # the marked test_sharded_load.py: same helper, one two-rank world, one
    # test), as do the cheap world suites — the collective, lockstep, mesh and
    # styles contracts, hundreds of sub-second programs — which are the
    # parallelism code's per-PR coverage. Only the marked set is checkable
    # (`--co -m parallel_world`); time a new module before deciding.
    "parallel_world: end-to-end runs across a spawned multi-rank process world; minutes each, so the PR gate deselects them and the nightly CPU job runs them",
]
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__"]
# An unregistered marker is a collection error, not a warning: the cost marker
# above is opt-in, so a misspelt `measurment_study` on a new study module would
# otherwise warn once in a 12 000-test log and land the module on the PR gate.
addopts = ["--strict-markers"]

[tool.coverage.run]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.scripts]
# One entry point over both document types; it dispatches on the `steps` section
causalab = "causalab.cli:main"

[tool.maturin]
# Build the Python package with the PyO3 extension from crates/.
# See docs/fastersafetensors.md.
module-name = "causalab.io.fastersafetensors._core"
manifest-path = "crates/fst-py/Cargo.toml"
features = ["extension-module"]
strip = true
include = [{ path = "docs/profiles/*.json", format = "sdist" }]

[tool.uv]
# Rebuild when Python build settings or Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[project.optional-dependencies]
# Jupyter and interactive causal-graph apps. Dash imports occur when an app
# is built, so headless users can install the base package.
notebook = [
    "ipywidgets",
    "jupyterlab",
    "ipycytoscape",
    "jupyter-dash",
    "ipykernel>=7.0.1",
    "dash",
    "dash-cytoscape",
]
# The nnsight tracing engine. Re-run the address canary when changing its pin.
nnsight = ["nnsight"]

# Optional Linux GPU kernels. Neither is part of the base or dev install.
# Transformers selects installed FLA/causal-conv1d functions automatically;
# FlashAttention is selected explicitly through attn_implementation.
flash-attn = ["flash-attn==2.8.3.post1; sys_platform == 'linux'"]
flash-linear-attention = [
    "flash-linear-attention[cuda]>=0.5.2; sys_platform == 'linux'",
    "causal-conv1d==1.7.0; sys_platform == 'linux'",
]

[build-system]
# The compiled extension requires Rust for builds and uv sync.
# rust-toolchain.toml pins the toolchain; Cargo.toml sets the minimum version.
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[dependency-groups]
# CI lint needs pre-commit and its isolated hook environments.
# Keeping this group separate lets lint run without torch and nnsight.
lint = [
    "pre-commit>=4.4.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "docs"},
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6.0",
    # Pin the formatter so local checks and CI produce the same output.
    "ruff==0.14.5",
    "basedpyright",
    "scikit-learn-stubs",
    "pandas-stubs",
    "scipy-stubs",
    "ipdb>=0.13.13",
    "hypothesis>=6.0",
    # The causal-graph app tests need these optional runtime dependencies.
    "dash",
    "dash-cytoscape",
    # the nnsight engine's parity suite runs in the default dev env (CI uses
    # `uv sync --frozen`, which installs this group); the runtime dependency
    # itself is the optional extra above
    "nnsight",
]
docs = [
    "griffe>=2.3.0",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocs-material>=9.7.7",
    "mkdocs-section-index>=0.3.12",
    "mkdocstrings[python]>=1.0.6",
]

[tool.uv.sources]
# Use the verified revision for both the extra and the dev group.
nnsight = { git = "https://github.com/ndif-team/nnsight.git", rev = "8c480727" }

[tool.uv.extra-build-dependencies]
# Compile extensions against the same torch used at runtime, in isolation.
flash-attn = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja", "wheel"]
causal-conv1d = [{ requirement = "torch", match-runtime = true }, "packaging", "ninja"]

# These releases compute metadata through setup.py, which imports torch/CUDA.
# Supplying their published metadata lets even CPU/macOS users resolve the
# universal lock without building optional CUDA extensions. Keep these versions
# aligned with the extras above; re-check upstream metadata when bumping them.
[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3.post1"
requires-python = ">=3.9"
requires-dist = ["torch", "einops"]

[[tool.uv.dependency-metadata]]
name = "causal-conv1d"
version = "1.7.0"
requires-python = ">=3.9"
requires-dist = ["torch", "packaging", "ninja"]


[tool.ruff]
# target-version inferred from project.requires-python
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".venv",
    # Exclude all tasks except MCQA
    "causalab/tasks/entity_binding",
    "causalab/tasks/IOI",
    # Generated research output.
    "agent_logs",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks frequently interleave imports with setup/markdown cells (E402)
# and use single-letter math conventions like `l` for layer/loss (E741).
"*.ipynb" = ["E402", "E741"]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"
exclude = [
    "**/__pycache__",
    "**/.venv",
    ".venv",
    # Exclude all tasks except MCQA
    "causalab/tasks/entity_binding",
    "causalab/tasks/IOI",
    # Generated research output.
    "agent_logs",
]
# Disable cascading inference rules to avoid untyped code propagating errors
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
# Allow incomplete annotations while retaining the correctness checks below.
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"

[tool.mutmut]
# Mutation pass over the parallelism core (docs/model_parallelism.md §10.7).
# `uv pip install mutmut==3.7.0` into the venv (not a dependency), clear every
# `__pycache__` outside `.venv` (mutmut copies the tree with its mtimes, and a
# stale pytest-rewrite pyc carries the tree's `co_filename`, which breaks the
# simulator's call-site naming), then `CUDA_VISIBLE_DEVICES= .venv/bin/mutmut run`; `mutmut results` /
# `mutmut browse` read the verdicts. The gloo subprocess smokes (`*_run.py`,
# `test_sharded_load.py`, `test_interiors_sharded.py`, the engine's
# `test_kv_replication.py`) are outside the loop:
# one mutant costs minutes there, and mutmut's per-test coverage does not see
# `mp.spawn` children.
source_paths = ["causalab"]
only_mutate = [
    "causalab/protocol/parallel.py",
    "causalab/protocol/kv_replication.py",
    "causalab/neural/shared/parallel/agreements.py",
    "causalab/neural/shared/parallel/autograd.py",
    "causalab/neural/shared/parallel/collective.py",
    "causalab/neural/shared/parallel/context.py",
    "causalab/neural/shared/parallel/fragments.py",
    "causalab/neural/shared/parallel/launcher.py",
    "causalab/neural/shared/parallel/mesh.py",
    "causalab/neural/shared/parallel/placement.py",
    "causalab/neural/shared/parallel/placements.py",
    "causalab/neural/engines/pytorch_hooks/budget.py",
    "causalab/neural/engines/pytorch_hooks/rows.py",
    "causalab/neural/engines/pytorch_hooks/stages.py",
    "causalab/neural/engines/pytorch_hooks/kv_replication.py",
    "causalab/neural/engines/pytorch_hooks/partial_gradient.py",
    "causalab/neural/engines/pytorch_hooks/shard_read.py",
    "causalab/neural/engines/pytorch_hooks/styles/__init__.py",
    "causalab/neural/engines/pytorch_hooks/styles/fragment.py",
    "causalab/neural/shared/parallel/objects.py",
    "causalab/neural/shared/parallel/lockstep.py",
    "causalab/neural/shared/parallel/heartbeat.py",
    "causalab/neural/shared/parallel/watchdog.py",
    "causalab/neural/shared/parallel/mismatch.py",
    "causalab/neural/shared/parallel/memory.py",
    "causalab/neural/shared/parallel/serving.py",
    "causalab/neural/shared/parallel/spawn.py",
    "causalab/neural/shared/parallel/standin.py",
    "causalab/neural/shared/parallel/taps.py",
    "causalab/protocol/lockstep.py",
    "causalab/protocol/parallel_memory.py",
    "causalab/protocol/publish.py",
    "causalab/neural/engines/pytorch_hooks/sharding.py",
    "causalab/neural/engines/pytorch_hooks/residency.py",
    "causalab/neural/shared/symbol_dispatch.py",
    "causalab/neural/engines/pytorch_hooks/delta_interface.py",
    "causalab/neural/engines/pytorch_hooks/experts_interface.py",
]
also_copy = ["causalab/io/fastersafetensors", "causalab/configs"]
pytest_add_cli_args = [
    "-p", "no:cacheprovider",
    "-p", "tests._helpers.mutation_plugin",
    "--hypothesis-seed=0",
]
pytest_add_cli_args_test_selection = [
    "tests/protocol/test_parallel.py",
    "tests/protocol/test_parallel_context.py",
    "tests/protocol/test_parallel_plan.py",
    "tests/protocol/test_parallel_rows.py",
    "tests/protocol/test_kv_replication.py",
    "tests/protocol/test_cli_parallel.py",
    "tests/protocol/test_cli_parallel_rows.py",
    "tests/neural/shared/parallel",
    "tests/neural/shared/test_sites_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_context_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_context_parallel_train.py",
    "tests/neural/engines/pytorch_hooks/test_engine_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_executor_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_interiors_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_train_parallel.py",
    "tests/neural/engines/pytorch_hooks/test_train_pipeline.py",
    "tests/neural/engines/pytorch_hooks/test_train_sharded.py",
    "tests/neural/engines/pytorch_hooks/test_shard_read.py",
    "tests/neural/engines/pytorch_hooks/test_read_plan.py",
    "tests/neural/engines/pytorch_hooks/test_styles.py",
    "tests/neural/engines/pytorch_hooks/test_sharded_simulation.py",
